<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overlay 设置</title><link rel="stylesheet" href="/assets/settings.css"></head><body><main><h1>Social Stream Ninja · DeepSeek 翻译</h1><p>配置服务端连接、翻译和 Overlay 样式。保存后刷新 OBS Browser Source。</p><form id="form"><section class="card"><h2>连接与翻译</h2><div class="grid"><label>Session ID<input id="session_id" required></label><label>DeepSeek API Key<input id="api_key" type="password" placeholder="留空保持当前 Key"></label><label>DeepSeek 模型<input id="model"></label><label>翻译超时（秒）<input id="timeout" type="number" min="3" max="120"></label><label>最多显示消息数<input id="max" type="number" min="1" max="200"></label></div><label><input id="original" type="checkbox">显示英文原文</label><label><input id="avatar" type="checkbox">显示头像</label><label><input id="autostart" type="checkbox">自动连接 Social Stream Ninja</label><div id="key_state" class="hint"></div></section><section class="card"><h2>聊天样式</h2><p class="hint">可以粘贴 Social Stream Ninja dock URL，读取公开 URL 样式参数。</p><label>Ninja dock URL<input id="ninja_url" type="url" placeholder="https://socialstream.ninja/dock.html?..."/><button type="button" id="import_ninja">读取 Ninja 样式</button></label><div class="grid"><label>正文大小<input id="font_size" type="number" min="8" max="48"></label><label>昵称大小<input id="name_size" type="number" min="8" max="48"></label><label>来源大小<input id="source_size" type="number" min="8" max="32"></label><label>译文大小<input id="translation_size" type="number" min="8" max="48"></label><label>气泡内边距<input id="bubble_padding" type="number" min="0" max="40"></label><label>消息间距<input id="message_gap" type="number" min="0" max="40"></label><label>边框宽度<input id="border_width" type="number" min="0" max="10"></label><label>边框圆角<input id="border_radius" type="number" min="0" max="40"></label><label>气泡透明度<input id="bubble_opacity" type="number" min="0" max="100"></label><label>边框透明度<input id="border_opacity" type="number" min="0" max="100"></label></div><div class="grid colors"><label>正文颜色<input id="text_color" type="color"></label><label>昵称颜色<input id="name_color" type="color"></label><label>来源颜色<input id="source_color" type="color"></label><label>译文颜色<input id="translation_color" type="color"></label><label>气泡颜色<input id="bubble_color" type="color"></label><label>边框颜色<input id="border_color" type="color"></label><label>观看人数颜色<input id="viewer_count_color" type="color"></label></div><label><input id="show_avatar" type="checkbox">样式默认显示头像</label><label><input id="show_viewer_count" type="checkbox">默认显示观看人数</label><label><input id="shadow" type="checkbox">启用文字阴影</label></section><section class="card"><h2>操作</h2><p>Overlay：<a id="overlay_url"></a></p><button type="submit">保存全部设置</button><button type="button" id="test">测试 DeepSeek</button><button type="button" id="clear" class="danger">清除当前 Overlay 所有消息</button><div id="message"></div></section></form></main><script src="/assets/settings.js"></script></body></html>
